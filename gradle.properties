# إعدادات Gradle العامة
# جلسة التحقق العميق: رُفع Metaspace من 320m إلى 512m لأن compileReleaseFullKotlin
# باستراتيجية in-process كان ينهار بـ «AssertionError: Metaspace» — توليد الشيفرة
# المتراكم (KSP لـ Room وHilt + مترجم Compose) يستهلك أصنافاً مولّدة في الـ
# Metaspace تتجاوز 320m قبل اكتمال الترجمة.
#
# جلسة التحقق العميق المستقل (لاحقة): خُفضت الكومة من 1280m إلى 1024m وأُضيف
# ‎-XX:+UseSerialGC — التشخيص: على آلة 2GB بلا Swap كان الـ Daemon يُقتل من قتّال
# النظام (OOM killer) أثناء mergeDexReleaseFull دون أي استثناء JVM في السجل:
# الكومة 1280m + Metaspace الفعلي ~450m (أصناف مترجم كوتلن المحتجزة) + البنية
# الأصلية لـ G1 (~200m) تجاوزت معاً ذاكرة الآلة لحظة ذروة d8. الترجمة نفسها لا
# تحتاج 1280m (ذروة استخدامها الفعلية دون 700m) فكان الخفض آمناً، وSerialGC
# أصغر بنية أصلية من G1 بهوامش كافية لمراحل الدمج. الحد الأعلى 512m للـ
# Metaspace باقٍ كما هو لأنه شرط الترجمة الموثق أعلاه.
# جلسة تسليم النسخة الكاملة إلى buled (لاحقة): على آلة 1.99GB بلا Swap قُتل
# الـ Daemon أثناء mergeDexReleaseFull حتى مع الكومة 1024m («Gradle build
# daemon disappeared unexpectedly» — ذروة d8 مع مخرجات dexBuilder المقيمة
# رفعت RSS فوق ذاكرة الآلة). الخفض إلى 832m أبعد الذروة عن الحد فأكمل
# التجميع والتوقيع بنجاح، وهو آمن للترجمة أيضاً (ذروتها الفعلية دون 700m
# كما هو موثق أعلاه). إن كانت الآلة أضيق مستقبلاً: 768m.
org.gradle.jvmargs=-Xmx832m -XX:MaxMetaspaceSize=512m -XX:+UseSerialGC -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# تحسينات ذاكرة لبيئات البناء محدودة الموارد (جلسة التحقق العميق 2026):
# بناء المتغيّرات بالتسلسل بدل التوازي + عامل واحد فقط
org.gradle.parallel=false
org.gradle.workers.max=1
# جلسة التحقق العميق الحالية: التركيبة السابقة (Daemon ‏1024m + Daemon كوتلن مستقل
# ‏640m) كانت تتجاوز معاً ذاكرة الآلة الفعلية 2GB بعد طرح حصة النظام وعمليات
# البيئة، فيُقتل الـ Daemon بـ DaemonDisappearedException فور انتهاء
# compileReleaseFullKotlin. الإصلاح الجذري: استراتيجية in-process تدمج مترجم
# كوتلن داخل Daemon غرادل نفسه فتصبح JVM واحدة فقط بدل عمليتين.
#
# قيد حاسم اكتشفته جلسة التحقق العميق المستقل: على آلة 2GB بلا Swap لا يمكن تنفيذ
# clean + assembleReleaseFull في استدعاء واحد — فمرحلة الدمج (mergeExtDex/
# mergeDex) تسبقها في الـ Daemon نفسه ترجمة KSP+Compose ثم lintVital، وتبقى
# أصناف المترجم محتجزة في Metaspace (~450m) فوق الكومة أثناء ذروة d8 فيتجاوز
# RSS الإجمالي ذاكرة الآلة ويقتل قتّال النظام الـ Daemon بصمت (بلا استثناء JVM
# في السجل — «Gradle build daemon disappeared unexpectedly»). الحل المُعتمد:
# البناء على مرحلتين متعاقبتين يستفيدان من خبيئة غرادل (الترجمة والاختبارات
# ثم التجميع) — نفّذ الغلاف build-release-full.sh في جذر المشروع، وهو يُنتج
# APK النسخة الكاملة موقّعاً ومحاذى على هذه الآلة نفسها.
kotlin.compiler.execution.strategy=in-process

# جلسة التحقق العميق 2026-10-02: «النسخة المصغّرة» (assembleRelease مع R8
# وshrinkResources) تحتاج كومة أكبر من 832m — R8 في الوضع الكامل يرمي
# OutOfMemoryError: Java heap space داخل الـ Daemon نفسه، لأن الكومة المضبوطة
# هنا مشتركة مع كل مراحل البناء. لم تُرفع القيمة في هذا الملف عمداً كي لا يتضرر
# مسار «النسخة الكاملة» (releaseFull) على الآلات محدودة الذاكرة — وهو سبب ضبط
# 832m الموثق أعلاه. لبناء المصغّرة استخدم الغلاف المخصص الذي يتجاوز الكومة لهذا
# البناء وحده: ./build-release-minified.sh  (-Dorg.gradle.jvmargs="-Xmx2560m …")
