# إعدادات Gradle العامة
org.gradle.jvmargs=-Xmx1152m -XX:MaxMetaspaceSize=320m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# تحسينات ذاكرة لبيئات البناء محدودة الموارد (جلسة التحقق العميق 2026):
# بناء المتغيّرات بالتسلسل بدل التوازي + سقف ذاكرة أخفض لمترجم Kotlin
org.gradle.parallel=false
# جلسة التحقق العميق الحالية: خُفِّضت الأُسس أكثر وقُيِّد عدد العمّال بواحد،
# لأن التركيب القديم (Gradle ‏1280m + Kotlin ‏896m + عمّالا dex) كان يستنزف
# آلة بذاكرة 2GB فيُقتل الـ Daemon (DaemonDisappearedException) تحديداً عند
# mergeExtDexReleaseFull بعد نجاح الترجمة كاملة. القيم الجديدة مُثبتة عملياً:
# assembleReleaseFull تكتمل على آلة 2GB/نواتين (3د55ث) مع 25 اختباراً خضراء.
# (قيمة org.gradle.jvmargs معدّلة في أعلى الملف، وهنا بقيّة القيود)
org.gradle.workers.max=1
kotlin.daemon.jvmargs=-Xmx640m -XX:MaxMetaspaceSize=256m
