# إعدادات Gradle العامة
org.gradle.jvmargs=-Xmx1280m -XX:MaxMetaspaceSize=320m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# تحسينات ذاكرة لبيئات البناء محدودة الموارد (جلسة التحقق العميق 2026):
# بناء المتغيّرات بالتسلسل بدل التوازي + عامل واحد فقط
org.gradle.parallel=false
org.gradle.workers.max=1
# جلسة التحقق العميق الحالية: التركيبة السابقة (Daemon ‏1024m + Daemon كوتلن مستقل
# ‏640m) كانت تتجاوز معاً ذاكرة الآلة الفعلية 2GB بعد طرح حصة النظام وعمليات
# البيئة، فيُقتل الـ Daemon بـ DaemonDisappearedException فور انتهاء
# compileReleaseFullKotlin. الإصلاح الجذري: استراتيجية in-process تدمج مترجم
# كوتلن داخل Daemon غرادل نفسه فتصبح JVM واحدة فقط (1280m) بدل عمليتين،
# ويبقى هامش ~700MB لـ d8/aapt2 والنظام — اكتمل معها assembleReleaseFull
# ووقّع الحزمة بنجاح على هذه الآلة نفسها.
kotlin.compiler.execution.strategy=in-process
