name: Probe signing secret availability

# TEMPORARY diagnostic: reports only whether each candidate secret name is
# present (never its value). Used once to decide how CI receives the release
# signing credential. Safe to delete after the decision is made.

on:
  workflow_dispatch:
  push:
    branches: ['arena/**']

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Report which signing secrets exist
        env:
          S_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          S_KEYSTORE_PROPERTIES: ${{ secrets.KEYSTORE_PROPERTIES }}
          S_KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          S_KEYSTORE: ${{ secrets.KEYSTORE }}
          S_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          S_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          S_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          S_STORE_FILE: ${{ secrets.STORE_FILE }}
          S_UNIHUB_KEYSTORE_PASSWORD: ${{ secrets.UNIHUB_KEYSTORE_PASSWORD }}
          S_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          S_SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          S_ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          S_BULED_REPO_TOKEN: ${{ secrets.BULED_REPO_TOKEN }}
        run: |
          for name in $(env | grep -oE '^S_[A-Z_]+' | sort); do
            if [ -n "$(printenv "$name")" ]; then
              echo "PRESENT: ${name#S_}"
            else
              echo "absent : ${name#S_}"
            fi
          done
