name: Build Android APK

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: android-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      # Publishing the installable test APK to a permanent GitHub Release
      # download link is the only step that needs write access. Everything
      # else in this job stays read-only.
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '17'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2 # v5
        with:
          cache-read-only: false

      - name: Check build verification helpers
        run: python3 -m unittest discover -s verification -p 'test_android_ci.py' -v

      - name: Check Appwrite project boundaries
        run: python3 scripts/check_appwrite_migration.py

      - name: Test Kotlin Appwrite auth bridge
        run: ./gradlew :appwrite-bridge:test --no-daemon --build-cache --stacktrace --console=plain 2>&1 | tee appwrite-bridge-tests.log

      - name: Run JVM unit tests
        run: ./gradlew testReleaseFullUnitTest --no-daemon --build-cache --stacktrace --console=plain 2>&1 | tee unit-tests.log

      - name: Run Android lint
        run: ./gradlew lintReleaseFull --no-daemon --build-cache --stacktrace --console=plain 2>&1 | tee lint.log

      - name: Build installable Debug APK
        run: ./gradlew assembleDebug --no-daemon --build-cache --stacktrace --console=plain 2>&1 | tee debug-build.log

      - name: Compile native Android UI tests
        run: ./gradlew assembleDebugAndroidTest --no-daemon --build-cache --stacktrace --console=plain 2>&1 | tee ui-test-build.log

      - name: Enable Android emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Test Galaxy and authentication UI on Android 35
        timeout-minutes: 20
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          emulator-boot-timeout: 300
          # Pin the host emulator independently of the Android 35 system image.
          # Emulator 36.1.9; compare against the disappearing 37.2.12 process.
          emulator-build: 13823996
          pre-emulator-launch-script: python3 scripts/emulator_monitor.py install
          api-level: 35
          arch: x86_64
          target: default
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -no-snapshot -gpu swangle_indirect -feature -Vulkan -noaudio -no-boot-anim -camera-back none -camera-front none -memory 2048 -cores 2 > ui-emulator.log 2>&1
          script: bash scripts/run_android_ui_tests.sh

      - name: Verify Debug APK alignment and signature
        id: debug-apk
        run: python3 scripts/android_ci.py verify debug --require-signed

      # Publish the test build as soon as it is verified, not at the end of the
      # job: the emulator suite and the release build run after this point, and
      # a flake there must not withhold an already-verified installable APK.
      # The asset name is fixed so the download link never changes.
      - name: Publish installable test APK to a permanent direct link
        if: github.event_name != 'pull_request' && steps.debug-apk.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          APK_PATH: ${{ steps.debug-apk.outputs.path }}
          APK_SHA256: ${{ steps.debug-apk.outputs.sha256 }}
        run: |
          set -euo pipefail
          TAG="test-latest"
          ASSET="UniHub-test.apk"
          cp "$GITHUB_WORKSPACE/$APK_PATH" "$ASSET"
          VERSION=$(python3 - <<'PY'
          import json, pathlib, re
          meta = pathlib.Path("app/build/outputs/apk/debug/output-metadata.json")
          if meta.is_file():
              print(json.load(meta.open(encoding="utf-8"))["elements"][0]["versionName"])
          else:
              gradle = pathlib.Path("app/build.gradle.kts").read_text(encoding="utf-8")
              print(re.search(r'versionName\s*=\s*"([^"]+)"', gradle).group(1))
          PY
          )
          # Recreate the release so the permanent link always serves the newest test build.
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" "$ASSET" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "نسخة الاختبار — UniHub v${VERSION}" \
            --notes "نسخة اختبار قابلة للتثبيت مباشرة (Debug)، مبنية تلقائياً من \`$GITHUB_REF_NAME\`.
          - الإصدار: v${VERSION}
          - نوع البناء: Debug (غير مصغّر، موقّع بمفتاح التصحيح)
          - SHA-256: \`${APK_SHA256}\`

          هذه **نسخة اختبار** وليست النسخة الكاملة. الرابط ثابت ويشير دائماً إلى أحدث بناء اختبار ناجح."
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${ASSET}"
          echo "TEST_APK_URL=$URL" >> "$GITHUB_ENV"
          echo "### رابط تحميل نسخة الاختبار" >> "$GITHUB_STEP_SUMMARY"
          echo "$URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload installable Debug APK
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: UniHub-debug
          path: ${{ steps.debug-apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      - name: Summarize tests, lint, and build errors
        if: always()
        run: python3 scripts/android_ci.py report

      - name: Summarize Android UI test results
        if: always()
        run: python3 scripts/android_ci.py report --instrumentation --minimum-tests 16

      - name: Upload diagnostic reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: UniHub-build-reports
          path: |
            *-build.log
            unit-tests.log
            appwrite-bridge-tests.log
            service/appwrite/build/test-results/test/
            service/appwrite/build/reports/tests/test/
            lint.log
            ui-tests.log
            ui-emulator.log
            ui-emulator-status.log
            ui-logcat.log
            ui-device-status.log
            ui-host-memory.log
            ui-host-kernel.log
            app/build/outputs/androidTest-results/connected/
            app/build/reports/androidTests/connected/
            app/build/test-results/testReleaseFullUnitTest/
            app/build/reports/tests/testReleaseFullUnitTest/
            app/build/reports/lint-results-releaseFull.*
          if-no-files-found: warn
          retention-days: 14
