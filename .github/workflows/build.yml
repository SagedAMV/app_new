name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      
    - name: Install Android SDK components
      run: |
        sdkmanager "platforms;android-35" "build-tools;35.0.0"
        
    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
          
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Grant execute permission for build scripts
      run: |
        if [ -f build-release-full.sh ]; then chmod +x build-release-full.sh; fi
        if [ -f build-release-minified.sh ]; then chmod +x build-release-minified.sh; fi
        
    - name: Compile Kotlin
      run: ./gradlew compileReleaseFullKotlin --no-daemon
      
    - name: Run lint (vital)
      run: ./gradlew lintVitalReleaseFull --no-daemon
      
    - name: Build Release Full APK
      run: ./gradlew assembleReleaseFull --no-daemon
      
    - name: Verify APK
      run: |
        APK_PATH="app/build/outputs/apk/releaseFull/app-releaseFull.apk"
        if [ ! -f "$APK_PATH" ]; then
          echo "ERROR: APK not found at $APK_PATH"
          exit 1
        fi
        echo "APK size: $(ls -lh $APK_PATH | awk '{print $5}')"
        
        # Verify zipalign
        ZIPALIGN=$(find $ANDROID_HOME/build-tools -name zipalign | sort -V | tail -1)
        if [ -n "$ZIPALIGN" ]; then
          $ZIPALIGN -c 4 "$APK_PATH" && echo "zipalign: OK"
        fi
        
        # Verify signature
        APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -1)
        if [ -n "$APKSIGNER" ]; then
          $APKSIGNER verify "$APK_PATH" && echo "apksigner: OK"
        fi
        
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: UniHub-releaseFull
        path: app/build/outputs/apk/releaseFull/app-releaseFull.apk
        retention-days: 30
        
    - name: Push APK to buled repository
      env:
        BULED_REPO_TOKEN: ${{ secrets.BULED_REPO_TOKEN }}
      run: |
        set -e
        
        # Only proceed if BULED_REPO_TOKEN is set
        if [ -z "$BULED_REPO_TOKEN" ]; then
          echo "BULED_REPO_TOKEN not set, skipping APK push to buled repository"
          echo "APK is available as GitHub Actions artifact for 30 days"
          exit 0
        fi
        
        # Clone buled repo
        git clone https://$BULED_REPO_TOKEN@github.com/SagedAMV/buled.git /tmp/buled
        cd /tmp/buled
        
        # Get version from build.gradle.kts
        VERSION=$(grep 'versionName' /home/runner/work/app_new/app_new/app/build.gradle.kts | head -1 | sed 's/.*"\(.*\)".*/\1/')
        APK_NAME="UniHub-v${VERSION}-release-full.apk"
        
        # Check if this version already exists
        if [ -f "$APK_NAME" ]; then
          echo "APK $APK_NAME already exists in buled repository, skipping upload"
          exit 0
        fi
        
        # Copy APK
        cp /home/runner/work/app_new/app_new/app/build/outputs/apk/releaseFull/app-releaseFull.apk "$APK_NAME"
        
        # Configure git
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        
        # Add and commit
        git add "$APK_NAME"
        git diff --staged --quiet && echo "No changes to commit" && exit 0
        
        git commit -m "تحديث النسخة الكاملة v${VERSION}

تم بناء APK تلقائياً بواسطة GitHub Actions
SHA-256: $(sha256sum $APK_NAME | cut -d' ' -f1)
الحجم: $(ls -lh $APK_NAME | awk '{print $5}')"
        
        git push origin main
