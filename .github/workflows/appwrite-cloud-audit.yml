name: Appwrite Cloud Audit

# Runs on demand (workflow_dispatch) and on arena/** pushes. On push it SKIPS
# gracefully when the repository secrets are not configured yet, so ordinary
# builds stay green. Secrets are masked in logs and never written to the
# repository or to the uploaded report (the script redacts them).
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "audit | repair | test | all"
        required: true
        default: "all"
        type: choice
        options: [audit, repair, test, all]
  push:
    branches: [main, 'arena/**']

permissions:
  contents: read

concurrency:
  group: appwrite-cloud-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up JDK 17 (for source checks parity)
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '17'
          distribution: temurin

      - name: Static migration guards
        run: python3 scripts/check_appwrite_migration.py

      - name: Run Appwrite cloud audit / repair / e2e
        env:
          AW_USERS_KEY: ${{ secrets.AW_USERS_KEY }}
          AW_FILES_KEY: ${{ secrets.AW_FILES_KEY }}
          INPUT_MODE: ${{ inputs.mode || 'all' }}
        run: |
          if [ -z "$AW_USERS_KEY" ] || [ -z "$AW_FILES_KEY" ]; then
            echo "::notice::AW_USERS_KEY / AW_FILES_KEY secrets are not configured — skipping the cloud audit."
            echo "Add them under Settings → Secrets and variables → Actions, then re-run."
            exit 0
          fi
          python3 scripts/appwrite_cloud_audit.py \
            --mode "$INPUT_MODE" \
            --report-dir "verification/appwrite-cloud-audit-$(date -u +%F)"

      - name: Publish report to job summary
        if: always()
        run: |
          report=$(ls -d verification/appwrite-cloud-audit-*/report.md 2>/dev/null | head -1)
          if [ -n "$report" ]; then
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No report produced." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload audit report artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: appwrite-cloud-audit-report
          path: verification/appwrite-cloud-audit-*/
          if-no-files-found: warn
